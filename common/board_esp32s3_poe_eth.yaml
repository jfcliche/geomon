# Waveshare ESP32-S3-POE-ETH: ESP32-S3R8 (8 MB octal PSRAM), 16 MB flash,
# W5500 Ethernet on SPI. Wi-Fi is intentionally not configured.

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  # DHCP is used by default. For a fixed address, uncomment and edit:
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
