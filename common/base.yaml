# Home Assistant connectivity, OTA updates, logging and housekeeping entities.

logger:
  # Logs go to the on-board USB-Serial/JTAG port (the USB-C connector).
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3

time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
    mac_address:
      name: MAC Address
      entity_category: diagnostic
  - platform: version
    name: ESPHome Version
    entity_category: diagnostic

button:
  - platform: restart
    name: Restart
    entity_category: config
